[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivis"
version = "2.0.0"
description = "Track how your brand ranks against competitors in AI search engines (ChatGPT, Claude, Gemini, Perplexity, Mistral, any OpenAI-compatible model)."
requires-python = ">=3.10"
dependencies = [
  "flask>=3.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=3.0"]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=2.0"]
mistral = ["mistralai>=2.0"]
perplexity = ["perplexityai>=0.40"]
all = ["openai>=3.0", "anthropic>=1.0", "google-genai>=2.0", "mistralai>=2.0", "perplexityai>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
aivis = "aivis.cli:main"

[tool.setuptools.packages.find]
include = ["aivis*"]

[tool.setuptools.package-data]
"aivis.dashboard" = ["templates/*.html", "static/*"]
